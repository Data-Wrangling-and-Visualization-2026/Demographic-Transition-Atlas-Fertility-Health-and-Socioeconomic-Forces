  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dwv
      POSTGRES_PASSWORD: dwv
      POSTGRES_DB: dwv
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwv -d dwv"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    volumes:
      - ./frontend/public:/app/frontend/public
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "dwv"
      POSTGRES_USER: "dwv"
      POSTGRES_PASSWORD: "dwv"
    ports:
      - "8000:8000"

