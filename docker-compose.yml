services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  scraper_scheduler:
    build:
      context: ./scraper
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      MONGO_URI: "mongodb://mongo:27017"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_HTTP_PORT: "8123"

      SCRAPE_INTERVAL_MINUTES: "60"
      SCRAPER_COMMAND: "python main.py"

      LOG_DIR: "/logs"
    volumes:
      - ./logs:/logs
    command: ["python", "scheduler.py"]

volumes:
  mongo_data:
  ch_data:
