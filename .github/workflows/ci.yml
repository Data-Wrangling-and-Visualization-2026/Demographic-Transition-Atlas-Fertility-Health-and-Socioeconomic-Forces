name: CI

on:
  push:
  pull_request:

jobs:
  python-backend:
    name: Python (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml

      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      - name: Fail on syntax errors
        run: |
          python -m compileall .

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Run tests (if present)
        run: |
          if find . -type f -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest -q
          else
            echo "No Python tests found in backend/ — skipping."
          fi

  python-scraper:
    name: Python (scraper)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            scraper/requirements.txt
            scraper/pyproject.toml

      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest

      - name: Fail on syntax errors
        run: |
          python -m compileall .

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Run tests (if present)
        run: |
          if find . -type f -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest -q
          else
            echo "No Python tests found in scraper/ — skipping."
          fi

  frontend:
    name: Node (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint (if script exists)
        run: npm run lint --if-present

      - name: Tests (if script exists)
        run: npm test --if-present

      - name: Build (if script exists)
        run: npm run build --if-present
